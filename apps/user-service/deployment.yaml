apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: demo
  labels: {app: user-service}
spec:
  replicas: 2
  selector:
    matchLabels: {app: user-service}
  template:
    metadata:
      labels: {app: user-service}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: user-service
          image: ghcr.io/reynaldiekoz98/user-service:7a04d68
          ports:
            - containerPort: 3001
          readinessProbe:
            httpGet: {path: /health, port: 3001}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: 3001}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
