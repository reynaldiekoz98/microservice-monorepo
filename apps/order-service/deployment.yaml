apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: demo
  labels: {app: order-service}
spec:
  replicas: 2
  selector:
    matchLabels: {app: order-service}
  template:
    metadata:
      labels: {app: order-service}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: order-service
          image: ghcr.io/reynaldiekoz98/order-service:0ad849b
          ports:
            - containerPort: 3003
          env:
            - name: USER_SERVICE_URL
              value: http://user-service:3001
            - name: PRODUCT_SERVICE_URL
              value: http://product-service:3002
          readinessProbe:
            httpGet: {path: /health, port: 3003}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: 3003}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
